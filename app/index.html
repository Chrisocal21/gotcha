<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4ddcc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gotcha" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Photograph real animals and collect them as one-of-a-kind illustrated cards." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gotcha</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash of the wrong one.
      try {
        var t = localStorage.getItem("gotcha.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("gotcha.motion") === "reduced") document.documentElement.setAttribute("data-motion", "reduced");
        var s = JSON.parse(localStorage.getItem("gotcha.stylevars") || "null");
        if (s) {
          for (var k in s.vars) document.documentElement.style.setProperty(k, s.vars[k]);
          if (s.pattern && s.pattern !== "none") document.documentElement.setAttribute("data-pattern", s.pattern);
          if (s.dark) document.documentElement.setAttribute("data-skin-dark", "1");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
